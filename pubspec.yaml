name: my_app_update
description: A Flutter plugin for Android Google Play In-App Updates.
version: 0.0.1

environment:
  sdk: ^3.13.4
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.margsoft.margsoft_in_app_update
        pluginClass: MargsoftInAppUpdatePlugin